{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="CryptoGate - Cyber Writeups">
  <meta property="og:title" content="{{ page.title | default(config.site_name) }} - CryptoGate">
  <meta property="og:description" content="{{ page.meta.description if page.meta and page.meta.description else 'Documentation de mes labs en cybersécurité : HTB, PortSwigger, pwn.college, CTF et labo Active Directory.' }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="https://cryptogate-hub.github.io/cyber-writeups/assets/og-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
