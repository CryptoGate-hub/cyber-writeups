      - First Contact: htb/challenges/first-contact.md
      - Flag Command: htb/challenges/flag-command.md
      - Low Logic: htb/challenges/low-logic.md
      - OpenSecret: htb/challenges/opensecret.md
      - Social Media Investigation: htb/challenges/social-media-investigation-hub.md
      - SpookyPass: htb/challenges/spookypass.md
