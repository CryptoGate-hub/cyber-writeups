site_name: CryptoGate - Cyber Writeups
site_url: https://cryptogate-hub.github.io/cyber-writeups
site_description: Writeups HTB - PortSwigger - pwn.college - CTF
site_author: CryptoGate
docs_dir: docs

repo_name: CryptoGate-hub/cyber-writeups
repo_url: https://github.com/CryptoGate-hub/cyber-writeups
edit_uri: ""

theme:
  name: material
  language: fr
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mode clair
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mode sombre
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/shield-lock
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Hack The Box:
    - Vue d ensemble: htb/index.md
    - Starting Point:
      - Vue d ensemble: htb/starting-point/index.md
      - 01 Meow: htb/starting-point/labs/01-meow.md
      - 02 Fawn: htb/starting-point/labs/02-fawn.md
      - 03 Dancing: htb/starting-point/labs/03-dancing.md
      - 04 Redeemer: htb/starting-point/labs/04-redeemer.md
      - 05 Appointment: htb/starting-point/labs/05-appointment.md
      - 06 Sequel: htb/starting-point/labs/06-sequel.md
      - 07 Oasis: htb/starting-point/labs/07-oasis.md
      - 08 Responder: htb/starting-point/labs/08-responder.md
      - 09 Three: htb/starting-point/labs/09-three.md
      - 10 Vaccine: htb/starting-point/labs/10-vaccine.md
      - 11 Oopsie: htb/starting-point/labs/11-oopsie.md
      - 12 Archetype: htb/starting-point/labs/12-archetype.md
      - 13 Unified: htb/starting-point/labs/13-unified.md
    - Machines:
