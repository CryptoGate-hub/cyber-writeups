site_name: CryptoGate - Cyber Writeups
site_url: https://cryptogate-hub.github.io/cyber-writeups
site_description: Writeups HTB - PortSwigger - pwn.college - CTF
site_author: CryptoGate

repo_name: CryptoGate-hub/cyber-writeups
repo_url: https://github.com/CryptoGate-hub/cyber-writeups
edit_uri: ""
use_directory_urls: true

theme:
  name: material
  language: fr
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mode clair
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mode sombre
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/shield-lock
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index/
  - Hack The Box:
    - Vue d ensemble: htb/index/
    - Starting Point:
      - Vue d ensemble: htb/starting-point/index/
      - 01 Meow: htb/starting-point/labs/01-meow/
      - 02 Fawn: htb/starting-point/labs/02-fawn/
      - 03 Dancing: htb/starting-point/labs/03-dancing/
      - 04 Redeemer: htb/starting-point/labs/04-redeemer/
      - 05 Appointment: htb/starting-point/labs/05-appointment/
      - 06 Sequel: htb/starting-point/labs/06-sequel/
      - 07 Oasis: htb/starting-point/labs/07-oasis/
      - 08 Responder: htb/starting-point/labs/08-responder/
      - 09 Three: htb/starting-point/labs/09-three/
      - 10 Vaccine: htb/starting-point/labs/10-vaccine/
      - 11 Oopsie: htb/starting-point/labs/11-oopsie/
      - 12 Archetype: htb/starting-point/labs/12-archetype/
      - 13 Unified: htb/starting-point/labs/13-unified/
    - Machines:
      - Vue d ensemble: htb/machines/index/
      - Cap: htb/machines/cap/
      - Orion: htb/machines/orion/
      - Nexus: htb/machines/nexus/
      - Reactor: htb/machines/reactor/
    - Sherlocks DFIR:
      - Vue d ensemble: htb/sherlocks/index/
      - Brutus: htb/sherlocks/brutus/
      - Unit42: htb/sherlocks/unit42/
      - Campfire-1: htb/sherlocks/campfire-1/
      - Campfire-2: htb/sherlocks/campfire-2/
    - Challenges:
      - Vue d ensemble: htb/challenges/index/
      - First Contact: htb/challenges/first-contact/
      - Flag Command: htb/challenges/flag-command/
      - Low Logic: htb/challenges/low-logic/
      - OpenSecret: htb/challenges/opensecret/
      - Social Media Investigation: htb/challenges/social-media-investigation-hub/
      - SpookyPass: htb/challenges/spookypass/
      - The Puppet Master: htb/challenges/the-puppet-master/
      - WebVault Time Machine: htb/challenges/webvault-time-machine/
  - Web Security:
    - PortSwigger Labs: web-security/portswigger/index/
